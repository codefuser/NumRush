<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hex Shield -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" stroke="url(#grad1)" stroke-width="8" fill="#111827" filter="url(#glow)"/>
  <!-- Target Grid Icon -->
  <circle cx="100" cy="100" r="45" stroke="#00F0FF" stroke-width="4" stroke-dasharray="8 4" fill="none" />
  <!-- Number Symbol 'N' & '1' -->
  <path d="M70,135 L70,65 L105,115 L105,65" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M125,75 L135,65 L135,135" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Accent Sparkle -->
  <polygon points="160,40 164,48 172,52 164,56 160,64 156,56 148,52 156,48" fill="#F59E0B" />
</svg>
